# Helm chart CI (deploy/helm/futureagi: the Distributed setup on Kubernetes).
#
#   static  on the latest Helm 4 and the latest Helm 3, twice: against the
#           chart directory and against the chart as helm-release.yml packages
#           it (hack/package.sh --no-digests, so a file .helmignore drops by
#           mistake fails here). Each run is deploy/helm/futureagi/hack/check.sh:
#           the chart's defaults and inconsistent values refuse to render with
#           guidance; helm lint --strict and helm template for every value set
#           (examples/ and ci/; gitops rendered twice, identically); kubeconform -strict against the oldest
#           supported and the newest GA Kubernetes; the rendered manifests'
#           invariants (hack/rendered_checks.py); values.yaml,
#           values.schema.json and the README table agree; the ClickHouse
#           config matches the Standalone install's and the UI's security
#           headers the frontend image's. Then: no subchart (Chart.yaml
#           dependencies or charts/) and no Bitnami image in any rendered
#           manifest, the chart's version must follow the platform release
#           (release-please moves it), and hack/package.sh turns release
#           notes into artifacthub.io/changes as expected.
#   release-tools
#           installs every tool helm-release.yml pins, with its own Install
#           steps, versions and actions, and publishes nothing: that workflow
#           runs only on a release tag, after the images are published, so a
#           pin that cannot install would otherwise first fail a release.
#   kind    builds the backend, frontend, fi-collector and agentcc-gateway
#           images from this checkout, installs the chart with Helm 4 on kind
#           with every datastore bundled, and runs
#           deploy/helm/futureagi/hack/kind-smoke.sh: rollout, /health/, the
#           first admin (bootstrap.admin) signing in, helm test, the bootstrap
#           job's schema, CDC and schedules, a second account from
#           manage.py create_user, a refused volume resize, an in-place
#           upgrade that must keep the generated keys and the first admin, and
#           a rollback that must put the previous Secret back.
name: Helm chart CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "deploy/helm/**"
      - "deploy/standalone/clickhouse/**"
      - "futureagi/.ci/clickhouse-storage-policy.xml"
      - "frontend/security-headers.conf"
      - "futureagi/accounts/management/commands/create_user.py"
      - "futureagi/accounts/utils.py"
      - "futureagi/tfc/management/commands/bootstrap_install.py"
      - "futureagi/model_hub/apps.py"
      - ".github/workflows/helm-ci.yml"
      - ".github/workflows/helm-release.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".prettierignore"
  push:
    branches: [dev, main]
    paths:
      - "deploy/helm/**"
      - "deploy/standalone/clickhouse/**"
      - "futureagi/.ci/clickhouse-storage-policy.xml"
      - "frontend/security-headers.conf"
      - "futureagi/accounts/management/commands/create_user.py"
      - "futureagi/accounts/utils.py"
      - "futureagi/tfc/management/commands/bootstrap_install.py"
      - "futureagi/model_hub/apps.py"
      - ".github/workflows/helm-ci.yml"
      - ".github/workflows/helm-release.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".prettierignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same Helm releases as helm-release.yml, pinned with their sha256
  # (get.helm.sh/<file>.sha256sum). Helm 4 is what the release publishes with
  # and what the kind job installs with.
  HELM_VERSION: v4.3.0
  HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
  HELM3_VERSION: v3.22.0
  HELM3_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
  # The oldest Kubernetes the chart supports (Chart.yaml kubeVersion) and the
  # newest GA minor kubeconform has schemas for.
  KUBE_VERSIONS: "1.27.0 1.37.0"

jobs:
  static:
    name: lint, template, kubeconform (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        helm: [4, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm ${{ matrix.helm }} and kubeconform
        env:
          MAJOR: ${{ matrix.helm }}
        run: |
          set -euo pipefail
          if [ "$MAJOR" = 4 ]; then version=$HELM_VERSION sha=$HELM_SHA256; else version=$HELM3_VERSION sha=$HELM3_SHA256; fi
          fetch() { # url sha256 -> file in $RUNNER_TEMP
            curl -fsSL -o "$RUNNER_TEMP/${1##*/}" "$1"
            echo "$2  $RUNNER_TEMP/${1##*/}" | sha256sum -c -
          }
          fetch "https://get.helm.sh/helm-${version}-linux-amd64.tar.gz" "$sha"
          fetch "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA256"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm-${version}-linux-amd64.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          tar -xzf "$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/helm" version
          "$RUNNER_TEMP/bin/kubeconform" -v

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install PyYAML==6.0.3

      - name: Chart checks (chart directory)
        env:
          OUT_DIR: ${{ runner.temp }}/helm-rendered/source
        run: deploy/helm/futureagi/hack/check.sh

      - name: Package
        # As helm-release.yml does, without image digests (the images of an
        # unreleased commit do not exist).
        run: |
          set -euo pipefail
          tgz=$(deploy/helm/futureagi/hack/package.sh --no-digests --destination "$RUNNER_TEMP/dist")
          echo "TGZ=$tgz" >> "$GITHUB_ENV"
          tar -tzf "$tgz"

      - name: Chart checks (packaged .tgz)
        # check.sh checks the chart directory it sits in: run it from the
        # unpacked package with the maintenance scripts and CI value sets
        # (which .helmignore leaves out) copied back in.
        env:
          OUT_DIR: ${{ runner.temp }}/helm-rendered/package
        run: |
          set -euo pipefail
          unpacked=$(mktemp -d)
          tar -xzf "$TGZ" -C "$unpacked"
          cp -R deploy/helm/futureagi/hack deploy/helm/futureagi/ci "$unpacked/futureagi/"
          "$unpacked/futureagi/hack/check.sh"

      - name: No subchart, no Bitnami image
        # The chart bundles its evaluation datastores itself and depends on no
        # other chart; the Bitnami catalog moved to a legacy tier.
        env:
          RENDERED: ${{ runner.temp }}/helm-rendered
        run: |
          set -euo pipefail
          failed=0
          chart=deploy/helm/futureagi
          if grep -nE '^dependencies:' "$chart/Chart.yaml"; then
            echo "::error file=$chart/Chart.yaml::the chart declares dependencies: it ships no subcharts"
            failed=1
          fi
          if [ -e "$chart/charts" ] || tar -tzf "$TGZ" | grep -E '^futureagi/charts/'; then
            echo "::error::the chart has a charts/ directory: it ships no subcharts"
            failed=1
          fi
          if grep -rhE '^[[:space:]]*(- )?image:' "$RENDERED" | grep -E '(^|[/:"[:space:]])bitnami(legacy|secure|charts)?/'; then
            echo "::error::a rendered manifest uses a Bitnami image"
            failed=1
          fi
          [ "$failed" = 0 ] && echo "no subchart, no Bitnami image"
          exit "$failed"

      - name: The chart's version follows the platform release
        # release-please rewrites the chart's version and appVersion (the lines
        # marked x-release-please-version) in every release PR, so on main, where
        # it runs, they equal .release-please-manifest.json. dev receives the
        # manifest only when main is merged back: there the chart may be ahead
        # of it, never behind.
        if: matrix.helm == 4
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          chart_file=deploy/helm/futureagi/Chart.yaml
          failed=0
          error() {
            echo "::error file=$chart_file::$*"
            failed=1
          }
          jq -e '.packages["."]["extra-files"][]? | objects | select(.type == "generic" and .path == "deploy/helm/futureagi/Chart.yaml")' \
            release-please-config.json >/dev/null ||
            error "release-please-config.json must list $chart_file in extra-files ({type: generic}), or releases never move its version"
          for key in version appVersion; do
            grep -qE "^$key: .*# x-release-please-version$" "$chart_file" ||
              error "the $key line must end with # x-release-please-version"
          done
          version=$(sed -nE 's/^version: *"?([^" #]+)"?.*/\1/p' "$chart_file")
          app=$(sed -nE 's/^appVersion: *"?([^" #]+)"?.*/\1/p' "$chart_file")
          release=$(jq -r '."."' .release-please-manifest.json)
          [ "$app" = "v$version" ] || error "appVersion $app must be v$version (the chart's version)"
          if [ "$BRANCH" = main ]; then
            [ "$version" = "$release" ] ||
              error "version $version must be the platform release $release: set version: $release and appVersion: \"v$release\""
          elif [ "$(printf '%s\n%s\n' "$version" "$release" | sort -V | head -n1)" != "$release" ]; then
            error "version $version is older than the platform release $release"
          fi
          [ "$failed" = 0 ] && echo "chart $version (appVersion $app), platform release $release on $BRANCH"
          exit "$failed"

      - name: Artifact Hub changelog from release notes
        # hack/package.sh --changes, as helm-release.yml runs it on the
        # release-please notes: a fix listed twice (merged to dev and to main)
        # is one entry with the PR links of both, the same text under another
        # kind stays, (helm)-scoped entries come first, and a CVE marks the
        # release as containing security updates.
        if: matrix.helm == 4
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## [9.9.9](https://github.com/future-agi/future-agi/compare/v9.9.8...v9.9.9) (2026-01-01)

          ### Features

          * **frontend:** a new page ([#10](https://github.com/future-agi/future-agi/issues/10)) ([aaaaaaa](https://github.com/future-agi/future-agi/commit/aaaaaaa))
          * **helm:** a chart option ([bbbbbbb](https://github.com/future-agi/future-agi/commit/bbbbbbb))

          ### Bug Fixes

          * **oss:** a fix merged twice ([#11](https://github.com/future-agi/future-agi/issues/11)) ([ccccccc](https://github.com/future-agi/future-agi/commit/ccccccc))
          * **oss:** a fix merged twice ([#12](https://github.com/future-agi/future-agi/issues/12)) ([ddddddd](https://github.com/future-agi/future-agi/commit/ddddddd))
          * **oss:** a fix merged twice ([#11](https://github.com/future-agi/future-agi/issues/11)) ([eeeeeee](https://github.com/future-agi/future-agi/commit/eeeeeee))
          * **frontend:** a new page ([fffffff](https://github.com/future-agi/future-agi/commit/fffffff))
          * **backend:** patch CVE-2026-1234 ([1111111](https://github.com/future-agi/future-agi/commit/1111111))
          * **backend:** patch CVE-2026-1234 ([2222222](https://github.com/future-agi/future-agi/commit/2222222))
          EOF
          tgz=$(deploy/helm/futureagi/hack/package.sh --no-digests --changes "$RUNNER_TEMP/notes.md" --destination "$RUNNER_TEMP/changes")
          tar -xzOf "$tgz" futureagi/Chart.yaml > "$RUNNER_TEMP/changes/Chart.yaml"
          python - "$RUNNER_TEMP/changes/Chart.yaml" <<'PY'
          import json
          import sys

          import yaml

          with open(sys.argv[1]) as f:
              annotations = yaml.safe_load(f)["annotations"]
          issue = "https://github.com/future-agi/future-agi/issues/"
          expected = [
              {"kind": "added", "description": "helm: a chart option"},
              {"kind": "added", "description": "frontend: a new page", "links": [{"name": "#10", "url": issue + "10"}]},
              {
                  "kind": "fixed",
                  "description": "oss: a fix merged twice",
                  "links": [{"name": "#11", "url": issue + "11"}, {"name": "#12", "url": issue + "12"}],
              },
              {"kind": "fixed", "description": "frontend: a new page"},
              {"kind": "security", "description": "backend: patch CVE-2026-1234"},
          ]
          changes = yaml.safe_load(annotations["artifacthub.io/changes"])
          failed = False
          if changes != expected:
              print("::error::artifacthub.io/changes is not as expected (below: what package.sh wrote, then the expected entries)")
              print(json.dumps(changes, indent=2))
              print(json.dumps(expected, indent=2))
              failed = True
          if annotations["artifacthub.io/containsSecurityUpdates"] != "true":
              print("::error::artifacthub.io/containsSecurityUpdates must be true: the notes list a CVE")
              failed = True
          sys.exit(1 if failed else 0)
          PY
          echo "artifacthub.io/changes: as expected"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: helm-rendered-manifests-helm${{ matrix.helm }}
          path: ${{ runner.temp }}/helm-rendered
          retention-days: 7

  release-tools:
    name: install the tools helm-release.yml pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: helm-release.yml's pins and Install steps
        # Exports its env for the steps below and writes each of its `run:`
        # steps named "Install <tool>..." to a script. Fails when an action it
        # installs a tool with is not used in this job with the same ref and
        # inputs (or the reverse), or when this file's env disagrees with its
        # env.
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          import os
          import re
          import sys

          import yaml

          release_file = ".github/workflows/helm-release.yml"
          with open(release_file) as f:
              release = yaml.safe_load(f)
          with open(".github/workflows/helm-ci.yml") as f:
              ci = yaml.safe_load(f)
          # Actions that install no tool, or that publish.
          not_tools = {
              "actions/checkout",
              "actions/upload-artifact",
              "actions/download-artifact",
              "actions/attest-build-provenance",
          }


          def steps(workflow, job_id=None):
              for name, job in workflow["jobs"].items():
                  if job_id is None or name == job_id:
                      yield from job.get("steps") or []


          def actions(workflow, job_id=None):
              return [
                  (step["uses"], step.get("with") or {})
                  for step in steps(workflow, job_id)
                  if "uses" in step and step["uses"].split("@")[0] not in not_tools
              ]


          errors = [
              f"env {key} is {value} in helm-ci.yml, {release['env'][key]} here"
              for key, value in ci["env"].items()
              if key in release["env"] and str(value) != str(release["env"][key])
          ]
          wanted, installed = actions(release), actions(ci, "release-tools")
          errors += [
              f"{uses} (with: {inputs}) is not in helm-ci.yml's release-tools job with the same inputs"
              for uses, inputs in wanted
              if (uses, inputs) not in installed
          ]
          errors += [
              f"helm-ci.yml's release-tools job uses {uses} (with: {inputs}), which this workflow does not"
              for uses, inputs in installed
              if (uses, inputs) not in wanted
          ]
          scripts = []
          for step in steps(release):
              # "Install Helm", not "Install, check and upgrade on kind".
              if "run" not in step or not re.match(r"Install [A-Za-z]", step.get("name", "")) or step["run"] in scripts:
                  continue
              if "$" + "{{" in step["run"] or step.get("env"):  # split: Actions would expand it here
                  errors.append(f"step {step['name']!r}: helm-ci.yml runs Install steps as written, so they take no expressions or step env")
              scripts.append(step["run"])
          if errors:
              for error in errors:
                  print(f"::error file={release_file}::{error}")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for key, value in release["env"].items():
                  f.write(f"{key}={value}\n")
          os.makedirs(os.path.join(os.environ["RUNNER_TEMP"], "install"))
          for i, script in enumerate(scripts):
              with open(os.path.join(os.environ["RUNNER_TEMP"], "install", f"{i:02d}.sh"), "w") as f:
                  f.write(script)
          print(f"{len(wanted)} tool actions and {len(scripts)} Install steps of {release_file}")
          PY

      - name: Run helm-release.yml's Install steps
        run: |
          set -euo pipefail
          for script in "$RUNNER_TEMP"/install/*.sh; do
            echo "::group::$script"
            cat "$script"
            bash --noprofile --norc -eo pipefail "$script"
            echo "::endgroup::"
          done

      # The actions helm-release.yml installs tools with, with its inputs (the
      # first step checks that they are the same).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          url: https://github.com/oras-project/oras/releases/download/v${{ env.ORAS_VERSION }}/oras_${{ env.ORAS_VERSION }}_linux_amd64.tar.gz
          checksum: ${{ env.ORAS_SHA256 }}

      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: The installed tools are the pinned versions
        run: |
          set -euo pipefail
          helm version --short | grep -F "$HELM_VERSION+"
          "$RUNNER_TEMP/helm3/helm" version --short | grep -F "$HELM3_VERSION+"
          kubeconform -v | grep -Fx "$KUBECONFORM_VERSION"
          cosign version 2>&1 | grep -E "^GitVersion: +$COSIGN_VERSION\$"
          oras version | grep -E "^Version: +$ORAS_VERSION\$"
          kind version
          python -c 'import yaml; print("PyYAML", yaml.__version__)'

  kind:
    name: install on kind (bundled datastores)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read # ghcr layer caches
    env:
      # Layer caches, read only (see standalone-ci.yml).
      CACHE_REPO: ghcr.io/future-agi/future-agi/e2e-cache
      BUILD_CACHE: ghcr.io/future-agi/future-agi/build-cache
      TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        # Four image builds plus a kind node holding them and the datastores.
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo systemctl stop docker docker.socket
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
          timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
          df -h / /mnt

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: ghcr login (layer cache reads)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: futureagi
          file: futureagi/Dockerfile.oss
          load: true
          provenance: false
          tags: futureagi/future-agi:${{ env.TAG }}
          cache-from: |
            type=registry,ref=${{ env.BUILD_CACHE }}:backend-amd64
            type=registry,ref=${{ env.CACHE_REPO }}:backend

      - name: Build frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          provenance: false
          tags: futureagi/frontend:${{ env.TAG }}
          cache-from: |
            type=registry,ref=${{ env.BUILD_CACHE }}:frontend-amd64
            type=registry,ref=${{ env.CACHE_REPO }}:frontend

      - name: Build fi-collector image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: fi-collector
          file: fi-collector/Dockerfile
          load: true
          provenance: false
          tags: futureagi/fi-collector:${{ env.TAG }}
          cache-from: |
            type=registry,ref=${{ env.BUILD_CACHE }}:fi-collector-amd64
            type=registry,ref=${{ env.CACHE_REPO }}:fi-collector

      - name: Build agentcc-gateway image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: agentcc-gateway
          file: agentcc-gateway/Dockerfile
          load: true
          provenance: false
          tags: futureagi/agentcc-gateway:${{ env.TAG }}
          cache-from: |
            type=registry,ref=${{ env.BUILD_CACHE }}:agentcc-gateway-amd64
            type=registry,ref=${{ env.CACHE_REPO }}:gateway

      - name: Install Helm
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/helm" version

      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: Install, check and upgrade on kind
        env:
          KIND_CLUSTER: futureagi
          NAMESPACE: futureagi
        run: deploy/helm/futureagi/hack/kind-smoke.sh
